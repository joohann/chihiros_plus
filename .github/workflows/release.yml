name: Publish release

# Publishes a GitHub release whenever a version tag (v*) is pushed.
# HACS shows updates based on published releases, so tagging a new version
# here makes it appear in HACS.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — AquaChihiros
          generate_release_notes: true
