apply_preset:
  target:
    entity:
      integration: my_chihiros
      domain: light
  fields:
    preset:
      required: true
      selector:
        select:
          options:
            - natural_day
            - plant_growth
            - low_tech
            - high_tech
            - moonlight
            - algae_protection_early
            - plant_recovery

set_rgbw:
  target:
    entity:
      integration: my_chihiros
      domain: light
  fields:
    red:
      required: true
      selector: { number: { min: 0, max: 100, unit_of_measurement: "%" } }
    green:
      required: true
      selector: { number: { min: 0, max: 100, unit_of_measurement: "%" } }
    blue:
      required: true
      selector: { number: { min: 0, max: 100, unit_of_measurement: "%" } }
    white:
      required: true
      selector: { number: { min: 0, max: 100, unit_of_measurement: "%" } }

start_algae_protection:
  target:
    entity:
      integration: my_chihiros
      domain: light
  fields:
    days:
      required: false
      default: 7
      selector: { number: { min: 0.1, max: 60, step: 0.5, unit_of_measurement: "d" } }

emergency_off:
  target:
    entity:
      integration: my_chihiros
      domain: light

sync_time:
  target:
    entity:
      integration: my_chihiros
      domain: light
